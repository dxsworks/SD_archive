<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>넘어가는 곳 확인</title>
<style>
  :root { --bg: #15181f; --panel: #1e222b; --line: #2d3340; --text: #e6e8ec; --dim: #8b93a3; --bad: #e5534b; --ok: #3fb950; --unsure: #d29922; --sel: #2f81f7; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font: 14px/1.4 'Malgun Gothic', sans-serif; }
  header { display: flex; gap: 12px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  header select, button { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--dim); }
  #status { color: var(--dim); margin-left: auto; }
  main { flex: 1; display: flex; min-height: 0; }
  #list { width: 420px; overflow-y: auto; border-right: 1px solid var(--line); }
  .item { display: flex; gap: 8px; align-items: center; padding: 6px 12px; cursor: pointer; border-left: 4px solid transparent; }
  .item:hover { background: var(--panel); }
  .item.sel { background: #22304a; border-left-color: var(--sel); }
  .item .name { flex: 1; font-family: Consolas, monospace; font-size: 12.5px; word-break: break-all; }
  .item .count { color: var(--dim); font-size: 12px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; border: 1px solid var(--dim); flex: none; }
  .dot.bad { background: var(--bad); border-color: var(--bad); }
  .dot.ok { background: var(--ok); border-color: var(--ok); }
  .dot.unsure { background: var(--unsure); border-color: var(--unsure); }
  #right { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 16px; gap: 12px; overflow-y: auto; }
  #stage { width: 862px; height: 538px; flex: none; background: linear-gradient(#41557d, #1c2333); border-radius: 6px; overflow: hidden; }
  #stage iframe { width: 862px; height: 538px; border: 0; display: block; }
  #title { font-family: Consolas, monospace; font-size: 16px; }
  #sub { color: var(--dim); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .mark { min-width: 120px; font-size: 15px; padding: 8px 14px; }
  .mark.bad.on { background: var(--bad); border-color: var(--bad); color: #fff; }
  .mark.ok.on { background: var(--ok); border-color: var(--ok); color: #fff; }
  .mark.unsure.on { background: var(--unsure); border-color: var(--unsure); color: #fff; }
  #note { width: 560px; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font: inherit; }
  #slow.on, .mode.on { background: var(--sel); border-color: var(--sel); }
  .keys { color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<header>
  <label>학생 <select id="model"></select></label>
  <button id="collect" title="펫을 다시 빨리 돌려 넘어가는 곳을 새로 모음 (표시는 이름이 같으면 유지)">다시 모으기</button>
  <span id="status"></span>
</header>
<main>
  <div id="list"></div>
  <div id="right">
    <div id="stage"><iframe id="pet"></iframe></div>
    <div id="title"></div>
    <div id="sub"></div>
    <div class="row">
      <button class="mark bad" data-mark="bad">이상함 (1)</button>
      <button class="mark ok" data-mark="ok">괜찮음 (2)</button>
      <button class="mark unsure" data-mark="unsure">모르겠음 (3)</button>
    </div>
    <input id="note" placeholder="메모 (선택): 어디가 어떻게 이상한지">
    <div class="row">
      <button id="prevEx">◀ 다른 예</button>
      <button id="again">다시 (Space)</button>
      <button id="slow">느리게 (S)</button>
      <button id="nextEx">다른 예 ▶</button>
    </div>
    <div class="row">
      <span class="keys">총 자세로 넘어갈 때:</span>
      <button class="mode" data-mode="A">예전: 그대로 (Q)</button>
      <button class="mode" data-mode="C">지금: 몸 방향 이어 받기 (E)</button>
      <button id="live" title="다시 틀기를 멈추고 지금 방법으로 40초 동안 펫처럼 전투 (목록을 누르면 다시 틀기로)">전투 보기 (B)</button>
    </div>
    <div class="keys">↑↓ 목록 이동 · ←→ 같은 곳의 다른 예 · 표시하면 다음 안 본 곳으로 넘어감</div>
  </div>
</main>
<script type="module">
const SIM_SECONDS = 1800; // 펫 시간으로 30분 돌려서 모은다
const CHUNK = 120;
const EXAMPLES = 4;       // 같은 곳마다 남길 예 수 (몸이 가장 많이 도는 것부터 고르게)
const DEFAULT_MODELS = ['Hoshino.glb', 'Hoshino (Swimsuit).glb', 'Shiroko.glb', 'Arisu (Battle).glb'];
const $ = (id) => document.getElementById(id);
const frame = $('pet');
const pet = () => frame.contentWindow.__pet;
const wrap = (a) => Math.atan2(Math.sin(a), Math.cos(a));
const tick = () => new Promise((r) => requestAnimationFrame(() => r()));

let data = await reviewBridge.load();
let model = null, pairs = [], sel = 0, ex = 0, slow = false, turnMode = 'C';
let pairModels = [];  // pairs[i]이 어느 학생 것인지 (★ 확인할 것 목록은 여러 학생이 섞임)
let petModel = null;  // 지금 펫 페이지에 띄운 학생
const ASK = '__ask';  // ★ 확인할 것: Claude가 판단한 것 중 사람이 맞는지 볼 것 (data.__ask = [{ model, key }], 판단은 각 곳의 claude)
const VERDICT = { bad: '이상함', ok: '괜찮음' };

const save = (() => {
  let timer = null;
  return () => { clearTimeout(timer); timer = setTimeout(() => reviewBridge.save(data), 300); };
})();

const models = await reviewBridge.models();
const ordered = [...DEFAULT_MODELS.filter((m) => models.includes(m)), ...models.filter((m) => !DEFAULT_MODELS.includes(m))];
$('model').innerHTML = (data[ASK]?.length ? `<option value="${ASK}">★ 볼 것 (${data[ASK].length})</option>` : '')
  + ordered.map((m) => `<option>${m}</option>`).join('');
$('model').onchange = () => open($('model').value);
$('collect').onclick = () => open(model, { recollect: true });

async function loadPet(name) {
  if (petModel === name && pet()?.clip) return;
  petModel = name;
  frame.src = `/src/renderer/index.html?review&model=${encodeURIComponent(name)}`;
  await new Promise((r) => { frame.onload = r; });
  for (let i = 0; i < 100 && !pet()?.clip; i++) await new Promise((r) => setTimeout(r, 100));
  if (!pet()?.clip) throw new Error('펫을 불러오지 못함');
  pet().turnMode = turnMode;
}

// 기록 하나에서 몸 전체가 도는 양(라디안): 넘어가기 직전 실제 방향 → 넘어간 뒤 향할 방향. 예를 고르는 데만 쓰고 화면엔 안 보임
const swing = (r, turns) => Math.abs(wrap(r.faceAfter + ((turns[r.to] ?? 0) * Math.PI) / 180 - r.yawBefore));
const round = (v) => (typeof v === 'number' ? +v.toFixed(4) : Array.isArray(v) ? v.map(round) : v);

async function collect() {
  const log = [];
  for (let t = 0; t < SIM_SECONDS; t += CHUNK) {
    $('status').textContent = `넘어가는 곳 모으는 중… ${Math.round((t / SIM_SECONDS) * 100)}%`;
    await tick();
    log.push(...pet().simulate(CHUNK));
  }
  const turns = pet().clipTurns;
  const groups = new Map();
  for (const r of log) {
    const key = `${r.from} → ${r.to}`;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(Object.fromEntries(Object.entries(r).map(([k, v]) => [k, round(v)])));
  }
  const old = new Map((data[model]?.pairs ?? []).map((p) => [p.key, p]));
  return [...groups].map(([key, recs]) => {
    recs.sort((a, b) => swing(b, turns) - swing(a, turns));
    const picks = [...new Set(Array.from({ length: EXAMPLES }, (_, i) => Math.round((i * (recs.length - 1)) / Math.max(1, EXAMPLES - 1))))];
    const { mark = null, note = '' } = old.get(key) ?? {};
    return { key, from: recs[0].from, to: recs[0].to, count: recs.length, examples: picks.map((i) => recs[i]), mark, note };
  }).sort((a, b) => b.count - a.count);
}

async function open(name, { recollect = false } = {}) {
  model = name;
  $('model').value = name;
  $('collect').disabled = name === ASK;
  if (name === ASK) {
    const list = data[ASK].map((a) => [a.model, data[a.model]?.pairs.find((p) => p.key === a.key)]).filter(([, p]) => p);
    pairModels = list.map(([m]) => m);
    pairs = list.map(([, p]) => p);
    renderList();
    await select(Math.max(0, pairs.findIndex((p) => !p.mark)));
    return;
  }
  $('status').textContent = '펫 불러오는 중…';
  await loadPet(name);
  if (recollect || !data[name]?.pairs?.length) {
    pairs = await collect();
    data[name] = { collected: new Date().toISOString().slice(0, 10), simSeconds: SIM_SECONDS, pairs };
    save();
  } else pairs = data[name].pairs;
  pairModels = pairs.map(() => name);
  pet().timeScale = slow ? 0.35 : 1;
  renderList();
  select(Math.max(0, pairs.findIndex((p) => !p.mark)));
}

function renderList() {
  $('list').innerHTML = pairs.map((p, i) => `<div class="item${i === sel ? ' sel' : ''}" data-i="${i}">
    <span class="dot ${p.mark ?? ''}"></span><span class="name">${model === ASK ? `${pairModels[i].replace('.glb', '')}: ` : ''}${p.key}</span><span class="count">${p.count}번</span></div>`).join('');
  const done = pairs.filter((p) => p.mark).length;
  $('status').textContent = model === ASK
    ? `★ 볼 것: ${pairs.length}곳 (Q 예전 / E 지금)`
    : `${model}: 표시 ${done} / ${pairs.length}곳 (펫 시간 ${SIM_SECONDS / 60}분 동안 넘어간 곳, 많이 나온 순)`;
}
$('list').onclick = (e) => { const it = e.target.closest('.item'); if (it) select(+it.dataset.i); };

async function select(i, exIndex = null) {
  if (!pairs.length) return;
  sel = (i + pairs.length) % pairs.length;
  const p = pairs[sel];
  exIndex ??= model === ASK ? p.claudeEx ?? 0 : 0;
  if (petModel !== pairModels[sel]) {
    $('sub').textContent = '펫 불러오는 중…';
    await loadPet(pairModels[sel]);
    pet().timeScale = slow ? 0.35 : 1;
  }
  ex = (exIndex + p.examples.length) % p.examples.length;
  for (const it of document.querySelectorAll('.item')) it.classList.toggle('sel', +it.dataset.i === sel);
  document.querySelector('.item.sel')?.scrollIntoView({ block: 'nearest' });
  $('title').textContent = p.key;
  const r = p.examples[ex];
  $('sub').textContent = `${p.count}번 나옴 · 예 ${ex + 1}/${p.examples.length} · 섞는 시간 ${r.fade}초 · 넘어간 뒤 상태 ${r.state}`
    + (model === ASK && p.mark && p.claude ? ` · Claude 판단: ${VERDICT[p.claude]}${p.mark === p.claude ? ' (같음)' : ''}` : '');
  for (const b of document.querySelectorAll('.mark')) b.classList.toggle('on', b.dataset.mark === p.mark);
  $('note').value = p.note ?? '';
  pet().replay(r);
}

function mark(m) {
  const p = pairs[sel];
  p.mark = m;
  save();
  renderList();
  const next = pairs.findIndex((q, i) => i > sel && !q.mark);
  const any = pairs.findIndex((q) => !q.mark);
  if (model === ASK) select(sel, ex); // 확인 목록은 표시하면 Claude 판단을 보여 주고 그 자리에 머묾 (↓로 다음)
  else select(next >= 0 ? next : any >= 0 ? any : sel);
}
for (const b of document.querySelectorAll('.mark')) b.onclick = () => mark(b.dataset.mark);
$('note').oninput = () => { pairs[sel].note = $('note').value; save(); };
$('again').onclick = () => select(sel, ex);
$('prevEx').onclick = () => select(sel, ex - 1);
$('nextEx').onclick = () => select(sel, ex + 1);
const toggleSlow = () => { slow = !slow; $('slow').classList.toggle('on', slow); pet().timeScale = slow ? 0.35 : 1; select(sel, ex); };
$('slow').onclick = toggleSlow;
const setMode = (m) => {
  turnMode = m;
  for (const b of document.querySelectorAll('.mode')) b.classList.toggle('on', b.dataset.mode === m);
  if (pet()) { pet().turnMode = m; select(sel, ex); }
};
for (const b of document.querySelectorAll('.mode')) b.onclick = () => setMode(b.dataset.mode);
setMode(turnMode);
const live = () => { pet().battleFor(40); $('sub').textContent = `전투 보기 (방법 ${turnMode}, 40초) · 목록을 누르면 다시 틀기로`; };
$('live').onclick = live;

// 누른 버튼에 초점이 남으면 Space가 그 버튼을 또 누른다
for (const b of document.querySelectorAll('button')) b.addEventListener('mouseup', () => b.blur());

addEventListener('keydown', (e) => {
  if (e.target === $('note') || e.target.tagName === 'SELECT') return;
  const k = e.key;
  if (k === '1') mark('bad');
  else if (k === '2') mark('ok');
  else if (k === '3') mark('unsure');
  else if (k === ' ') select(sel, ex);
  else if (k === 's' || k === 'S') toggleSlow();
  else if (k === 'q' || k === 'Q') setMode('A');
  else if (k === 'e' || k === 'E') setMode('C');
  else if (k === 'b' || k === 'B') live();
  else if (k === 'ArrowDown') select(sel + 1);
  else if (k === 'ArrowUp') select(sel - 1);
  else if (k === 'ArrowRight') select(sel, ex + 1);
  else if (k === 'ArrowLeft') select(sel, ex - 1);
  else return;
  e.preventDefault();
});

open(data[ASK]?.length ? ASK : ordered[0]).catch((err) => { $('status').textContent = `오류: ${err.message}`; console.error(err); });
</script>
</body>
</html>
