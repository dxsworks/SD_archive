<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>애니메이션 보기</title>
  <style>
    :root {
      --bg: #f4f5f8; --panel: #ffffff; --line: #e1e4ea; --text: #1d2230; --muted: #6b7385;
      --accent: #3d7bf7; --accent-soft: #e6eefe; --stage: #e9ecf2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181d; --panel: #1e2128; --line: #2c313b; --text: #e6e8ee; --muted: #8b93a5;
        --accent: #6c9cff; --accent-soft: #24304a; --stage: #23272f;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 "Segoe UI", "Malgun Gothic", system-ui, sans-serif; }
    body { display: grid; grid-template-columns: 280px 1fr; grid-template-rows: auto 1fr auto; height: 100vh; }
    header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; padding: 10px 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
    header h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 600; }
    header label { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
    select, button { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
    button { cursor: pointer; white-space: nowrap; }
    button:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    aside { overflow-y: auto; background: var(--panel); border-right: 1px solid var(--line); padding: 6px 0 12px; }
    .group { margin-top: 8px; }
    .group h2 { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 6px 14px 4px; font-weight: 600; }
    .clip { display: flex; justify-content: space-between; gap: 8px; width: 100%; text-align: left; border: 0; border-radius: 0; background: transparent; padding: 5px 14px; }
    .clip:hover { background: var(--accent-soft); }
    .clip.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    .clip small { color: var(--muted); font-variant-numeric: tabular-nums; }
    main { position: relative; background: var(--stage); min-height: 0; }
    main canvas { display: block; width: 100%; height: 100%; }
    #now { position: absolute; left: 14px; top: 12px; font-size: 16px; font-weight: 600; }
    #hint { position: absolute; right: 14px; bottom: 10px; color: var(--muted); font-size: 12px; }
    footer { grid-column: 2; display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: var(--panel); border-top: 1px solid var(--line); }
    footer input[type=range] { flex: 1; }
    #time { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 92px; text-align: right; }
  </style>
  <script type="importmap">
    { "imports": { "three": "../../node_modules/three/build/three.module.js", "three/addons/": "../../node_modules/three/examples/jsm/" } }
  </script>
</head>
<body>
  <header>
    <h1>애니메이션 보기</h1>
    <label>학생 <select id="model"></select></label>
    <label>무기 <select id="weapons">
      <option value="auto">자동</option><option value="on">보이기</option><option value="off">숨기기</option>
    </select></label>
    <label>속도 <select id="speed">
      <option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option>
    </select></label>
    <label><input type="checkbox" id="loop" checked> 반복</label>
    <button class="primary" id="attackNormal">공격 (서서)</button>
    <button class="primary" id="attackStand">공격 (방패)</button>
  </header>
  <aside id="list"></aside>
  <main>
    <canvas id="stage"></canvas>
    <div id="now"></div>
    <div id="hint">드래그: 회전 · 휠: 확대 · 우클릭 드래그: 이동</div>
  </main>
  <footer>
    <button id="pause">일시정지</button>
    <input type="range" id="seek" min="0" max="1000" value="0">
    <span id="time">0.00 / 0.00s</span>
  </footer>
  <script type="module" src="viewer.js"></script>
</body>
</html>
