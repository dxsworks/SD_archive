<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>메뉴</title>
  <style>
    :root {
      --blue: #2a95f2;
      --blue-dark: #1677d2;
      --yellow: #ffe14d;
      --ink: #2b3a4a;
      --ink-soft: #6a7f93;
      --line: #d6e4f0;
      --paper: #ffffff;
      --paper-2: #f3f8fd;
      --danger: #e0475b;
    }
    html, body { margin: 0; padding: 0; height: 100%; background: transparent; overflow: hidden; }
    body {
      font-family: 'Pretendard', 'Malgun Gothic', 'Segoe UI', sans-serif;
      font-size: 12px; color: var(--ink);
      user-select: none; cursor: default;
    }
    /* 창 안의 판 배치: 펼친 메뉴 + 하위 메뉴 자리. 오른쪽에 자리가 없으면 뒤집어 하위 메뉴가 왼쪽으로 */
    #root { display: inline-flex; align-items: flex-start; gap: 3px; padding: 10px; }
    #root.flip { flex-direction: row-reverse; }
    .subcol { position: relative; width: 150px; flex: none; }
    .subcol.wide { width: 214px; } /* 이름 옆 글자(받을 크기)가 있는 학생 목록 칸: 150px에선 "네루 (바니걸)"이 잘렸음 */

    .panel {
      background: var(--paper); border: 1px solid var(--line); border-radius: 5px; overflow: hidden;
      box-shadow: 0 4px 10px rgba(24, 70, 120, 0.22), 0 1px 2px rgba(24, 70, 120, 0.18);
    }
    .main { width: 168px; flex: none; }
    .sub { position: absolute; left: 0; width: 100%; }
    .sub.hidden { display: none; }

    /* 머리띠: 파란 띠 + 비스듬한 노란 줄 + 학생 이름 */
    .head {
      position: relative; display: flex; align-items: center; gap: 8px;
      padding: 6px 10px; background: var(--blue); color: #fff; overflow: hidden;
    }
    .head::after { /* 오른쪽 끝 비스듬한 밝은 무늬 */
      content: ''; position: absolute; right: -14px; top: 0; bottom: 0; width: 64px;
      background: repeating-linear-gradient(-60deg, rgba(255,255,255,0.16) 0 6px, transparent 6px 12px);
      transform: skewX(-20deg);
    }
    .head .bar { width: 3px; height: 12px; background: var(--yellow); transform: skewX(-20deg); flex: none; }
    .head .title { font-weight: bold; font-size: 12.5px; letter-spacing: 0.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .head .tag { margin-left: auto; font-size: 9px; letter-spacing: 1.2px; opacity: 0.85; position: relative; z-index: 1; }

    .list { padding: 4px; background: var(--paper-2); }
    .sub .list { max-height: 380px; overflow-y: auto; } /* 학원 14개 + 기타가 스크롤 없이 들어가게 */
    .sub .list::-webkit-scrollbar { width: 6px; }
    .sub .list::-webkit-scrollbar-thumb { background: #b9cde0; border-radius: 3px; }

    /* 항목: 마우스를 올리면 비스듬한 파란 막대 (글자는 똑바로) */
    .item {
      position: relative; display: flex; align-items: center; gap: 8px;
      padding: 4px 8px; min-height: 15px; border-radius: 2px; z-index: 0;
    }
    .item::before {
      content: ''; position: absolute; inset: 0 2px; z-index: -1;
      background: var(--blue); transform: skewX(-12deg); opacity: 0;
    }
    .item:hover::before, .item.open::before { opacity: 1; }
    .item:hover, .item.open { color: #fff; }
    .item.disabled { color: #a9b7c4; }
    .item.disabled::before { display: none; }
    .item .label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item .hint { font-size: 10.5px; color: var(--ink-soft); white-space: nowrap; max-width: 64px; overflow: hidden; text-overflow: ellipsis; }
    .item .arrow { color: var(--blue); font-size: 8px; }
    .item:hover .hint, .item.open .hint, .item:hover .arrow, .item.open .arrow { color: #fff; }
    .item.danger { color: var(--danger); }
    .item.danger::before { background: var(--danger); }
    .item.danger:hover { color: #fff; }

    /* 켜고 끄는 항목: 스위치 */
    .switch { position: relative; width: 22px; height: 12px; border-radius: 6px; background: #c3d1de; flex: none; }
    .switch::after {
      content: ''; position: absolute; left: 2px; top: 2px; width: 8px; height: 8px; border-radius: 50%;
      background: #fff;
    }
    .switch.on { background: var(--blue); }
    .switch.on::after { left: 12px; }
    .item:hover .switch { background: rgba(255,255,255,0.45); }
    .item:hover .switch.on { background: var(--yellow); }

    /* 하나만 고르는 항목: 고른 것에 마름모 */
    .mark { width: 6px; height: 6px; flex: none; transform: rotate(45deg); border: 1.5px solid transparent; }
    .item.checked .mark { background: var(--blue); }
    .item.checked { color: var(--blue-dark); font-weight: bold; }
    .item.checked:hover .mark { background: var(--yellow); }
    .item.checked:hover { color: #fff; }
    /* 고른 것이 더 아래 단계에 있는 줄 (학원) */
    .item.has-pick { color: var(--blue-dark); font-weight: bold; }
    .item.has-pick:hover, .item.has-pick.open { color: #fff; }

    .sep { height: 1px; margin: 3px 5px; background: var(--line); }

    /* 합동 승리 얼굴 줄 (이름 위): 트로피 + 얼굴 + ▶ */
    .maincol { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; flex: none; }
    .jrow {
      display: flex; align-items: center; gap: 4px; padding: 3px 5px 3px 6px; border-radius: 15px;
      background: var(--paper); border: 1px solid var(--line);
      box-shadow: 0 2px 6px rgba(24, 70, 120, 0.2);
    }
    .jrow .cup { color: #d9a400; display: flex; }
    .face { position: relative; width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--blue); background: #e3f1fd; overflow: visible; flex: none; }
    .face img, .face .ini { width: 26px; height: 26px; border-radius: 50%; display: block; object-fit: cover; }
    .face .ini { text-align: center; line-height: 26px; font-weight: bold; color: var(--blue-dark); }
    .face.me { border-color: var(--yellow); box-shadow: 0 0 0 1px #d9a400; }
    .face.away { border: 2px dashed #b9cde0; background: #eef2f6; }
    .face.away img { opacity: 0.35; filter: grayscale(1); }
    .face .plus { position: absolute; right: -4px; bottom: -4px; width: 13px; height: 13px; border-radius: 50%; background: #b9cde0; color: #fff; font-size: 11px; line-height: 13px; text-align: center; }
    .face.add .plus { background: var(--blue); }
    .face.add { cursor: pointer; }
    .face.add:hover { border-color: var(--blue); }
    .face.add:hover img { opacity: 0.7; filter: none; }
    .go { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-left: 2px; background: #eef2f6; color: #c7d3de; flex: none; }
    .go.on { background: var(--yellow); color: #7a5a00; cursor: pointer; }
    .go.on:hover { background: #ffd21a; transform: scale(1.08); }

  </style>
</head>
<body>
  <div id="root"></div>
  <script src="menu.js"></script>
</body>
</html>
